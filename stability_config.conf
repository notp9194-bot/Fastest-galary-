// Compose compiler stability config (app module). build.gradle.kts me `composeCompiler { stabilityConfigurationFile }`.
//
// Kyu: MediaItem me `android.net.Uri` hai (framework class, Compose use "unstable" maanta hai), isliye MediaItem, Album
// aur GridEntry bhi unstable the. Refresh/`vm.load()` par saare MediaItem naye objects bante hain; unstable hone se
// `Thumb(item = ...)` aur uske onClick lambda ki jaanch `===` (instance) se hoti thi, to har refresh par saare visible
// cells recompose hote the. Stable batane par `equals` se jaanch hoti hai: same media ka naya object => skip.
//
// Shart: ye sab immutable honi chahiye (data class, val fields). Koi `var` / mutable field jodo to yahan se hatao.
// Kotlin collections (List/Set/Map) jaan-boojh ke nahi jode: badi selection par har recompose me O(n) `equals` hota.

android.net.Uri
com.fastgallery.app.data.MediaItem
com.fastgallery.app.data.Album
com.fastgallery.app.data.GridEntry
